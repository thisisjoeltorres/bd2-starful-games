<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Videojuego - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">🎮 Nexus Games</a>
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/juegos">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ventas">Registrar Venta</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reportes">Reportes PDF</a></li>
                    <li class="nav-item"><a class="nav-link text-danger fw-bold" href="/logout">Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-secondary shadow-sm">
                    <div class="card-header bg-dark border-secondary">
                        <h4 class="mb-0">✏️ Editar Videojuego</h4>
                    </div>
                    <div class="card-body">
                        <form action="/juegos/actualizar/{{ juego.id_inventario }}" method="POST">
                            
                            <input type="hidden" name="id_juego" value="{{ juego.id_juego }}">

                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título del Videojuego</label>
                                <input type="text" class="form-control" id="titulo" name="titulo" value="{{ juego.titulo }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="genero" class="form-label">Género</label>
                                <input type="text" class="form-control" id="genero" name="genero" value="{{ juego.genero }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="plataforma" class="form-label">Plataforma / Consola</label>
                                <select class="form-select" id="plataforma" name="id_plataforma" required>
                                    <option value="1" {% if juego.id_plataforma == 1 %}selected{% endif %}>PlayStation 5</option>
                                    <option value="2" {% if juego.id_plataforma == 2 %}selected{% endif %}>Xbox Series X</option>
                                    <option value="3" {% if juego.id_plataforma == 3 %}selected{% endif %}>Nintendo Switch</option>
                                    <option value="4" {% if juego.id_plataforma == 4 %}selected{% endif %}>PC Digital/Físico</option>
                                </select>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label">Precio de Venta</label>
                                    <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ juego.precio }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="stock" class="form-label">Unidades Físicas (Stock)</label>
                                    <input type="number" class="form-control" id="stock" name="stock" value="{{ juego.stock }}" required min="0">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="/juegos" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-warning fw-bold text-dark">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

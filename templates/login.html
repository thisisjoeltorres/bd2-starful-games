<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
    <style>
        /* CSS rápido para centrar el login vertical y horizontalmente */
        body, html {
            height: 100%;
            background-color: #222;
        }
        .login-container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container login-container">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            
            <div class="text-center mb-4">
                <h1 class="display-5 text-primary fw-bold">🎮 NEXUS</h1>
                <p class="text-muted tracking-wider text-uppercase">Gestión de Inventario</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for categoria, mensaje in messages %}
                        <div class="alert alert-{{ categoria }} text-center shadow-sm" role="alert">
                            {{ mensaje }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card shadow-lg border-primary">
                <div class="card-body p-4 p-md-5">
                    <form action="/login" method="POST">
                        
                        <div class="mb-4">
                            <label for="username" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text bg-primary border-primary">👤</span>
                                <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="ej: admin">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-primary border-primary">🔑</span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                            </div>
                        </div>

                        <div class="d-grid mt-5">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                Iniciar Sesión
                            </button>
                        </div>
                        
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <small class="text-muted">© 2026 Nexus Games System. Acceso restringido.</small>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
